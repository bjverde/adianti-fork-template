<!--[main]-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_t{Welcome}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">

  <!-- Preheader (texto de pré-visualização, invisível no corpo) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    _t{Your account has been created successfully}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 0;">
    <tr>
      <td align="center">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">

          <!-- Ícone -->
          <tr>
            <td align="center" style="padding:48px 40px 20px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:56px; height:56px; background-color:#eaf1fd; border-radius:50%; text-align:center; vertical-align:middle; font-size:26px; color:#2f6fe0;">
                    &#10003;
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Título -->
          <tr>
            <td align="center" style="padding:0 40px 16px 40px;">
              <h1 style="margin:0; font-size:24px; line-height:30px; color:#111827; font-weight:700;">
                _t{Welcome}, {{user_name}}!
              </h1>
            </td>
          </tr>

          <!-- Texto principal -->
          <tr>
            <td align="center" style="padding:0 40px 32px 40px;">
              <p style="margin:0; font-size:15px; line-height:24px; color:#4b5563;">
                _t{Your account has been created successfully}. _t{We are happy to have you here}.
              </p>
            </td>
          </tr>

          <!-- Botão CTA -->
          <tr>
            <td align="center" style="padding:0 40px 48px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color:#2f6fe0; border-radius:8px;">
                    <a href="{{url}}" target="_blank" style="display:inline-block; padding:14px 32px; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;">
                      _t{Access} {{app_title}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

        <!-- Rodapé -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; margin-top:24px;">
          <tr>
            <td align="center" style="padding:0 24px;">
              <p style="margin:0; font-size:12px; line-height:18px; color:#9ca3af;">
                &copy; {{app_title}}. _t{All rights reserved}
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
<!--[/main]-->
